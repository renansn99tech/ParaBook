name: ParaBook CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: parabook_ci
          POSTGRES_USER: parabook
          POSTGRES_PASSWORD: parabook
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U parabook -d parabook_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEBUG: 'True'
      DATABASE_URL: postgres://parabook:parabook@127.0.0.1:5432/parabook_ci
      SECRET_KEY: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          # A verificação de compatibilidade usa a base real do push/PR, que
          # pode estar vários commits atrás do HEAD atual.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt pip-audit
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Generate strict OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --format openapi-json --file "${RUNNER_TEMP}/parabook-openapi.json"
      - name: Check canonical schema and web/Expo consumers
        run: python scripts/check_openapi_contracts.py --schema "${RUNNER_TEMP}/parabook-openapi.json" --canonical contracts/openapi.json
      - name: Reject breaking OpenAPI changes
        shell: bash
        env:
          OPENAPI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          ZERO_SHA='0000000000000000000000000000000000000000'
          if [ -z "${OPENAPI_BASE_SHA}" ] || [ "${OPENAPI_BASE_SHA}" = "${ZERO_SHA}" ]; then
            echo 'Primeiro baseline OpenAPI: comparação histórica ainda não aplicável.'
          elif ! git cat-file -e "${OPENAPI_BASE_SHA}^{commit}" 2>/dev/null; then
            echo "A base real ${OPENAPI_BASE_SHA} não está disponível para comparação." >&2
            exit 1
          elif git cat-file -e "${OPENAPI_BASE_SHA}:contracts/openapi.json" 2>/dev/null; then
            git show "${OPENAPI_BASE_SHA}:contracts/openapi.json" > "${RUNNER_TEMP}/parabook-openapi-base.json"
            python scripts/check_openapi_compatibility.py --baseline "${RUNNER_TEMP}/parabook-openapi-base.json" --candidate contracts/openapi.json
          else
            echo 'Primeiro baseline OpenAPI: o commit-base ainda não possui contrato canônico.'
          fi
      - name: Validate production static assets
        env:
          STATICFILES_USE_MANIFEST: 'True'
        run: python manage.py collectstatic --noinput
      - run: python manage.py test
      - run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parabook-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: parabook-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parabook-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: parabook-mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Auditoria informativa até a decisão de upgrade do Expo SDK 54.
      - run: npm audit --omit=dev --audit-level=high || true
