{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/obras-autores.css' %}">
{% endblock %}

{% block content %}

<section class="form-container">

    <div class="form-box">

        <h1>Envie sua obra</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="submit-btn">
                Enviar obra
            </button>

        </form>

    </div>

</section>

{% endblock %}
