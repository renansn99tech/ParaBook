{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/index.css' %}">
<link rel="stylesheet" href="{% static 'css/navbar.css' %}">
<link rel="stylesheet" href="{% static 'css/obras-autores.css' %}">
{% endblock %}

{% block content %}

<main>

<section class="form-container">
    <div class="form-box">

        <h1>Envie sua obra</h1>
        <p>Compartilhe seu livro com a comunidade ParaBook</p>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group">
        <label>Nome</label>
        <input type="text" name="nome" value="{{ livro.nome|default:'' }}">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ livro.email|default:'' }}">
    </div>

    <div class="form-group">
        <label>Título</label>
        <input type="text" name="titulo" value="{{ livro.titulo|default:'' }}">
    </div>

    <div class="form-group">
        <label>Categoria</label>
        <select name="categoria">
            <option value="filosofia">Filosofia</option>
            <option value="literatura">Literatura</option>
            <option value="religiosos">Religiosos</option>
            <option value="exatas">Exatas</option>
            <option value="infantis">Infantis</option>
            <option value="independente">Independente</option>
        </select>
    </div>

    <div class="form-group">
        <label>Descrição</label>
        <textarea name="descricao">{{ livro.descricao|default:'' }}</textarea>
    </div>

    <div class="form-group">
        <label>Arquivo</label>
        <input type="file" name="arquivo">
    </div>

    <div class="form-group checkbox">
        <input type="checkbox" name="autor">
        <label>Sou o autor</label>
    </div>

    <button type="submit" class="submit-btn">
        Enviar obra
    </button>

</form>


    </div>
</section>

</main>

{% endblock %}


{% block extra_js %}
<script src="{% static 'js/obras-autores.js' %}"></script>
<script src="{% static 'js/index.js' %}"></script>
<script src="{% static 'js/navbar.js' %}"></script>
{% endblock %}
