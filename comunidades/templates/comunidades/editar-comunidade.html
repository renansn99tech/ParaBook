{% extends 'base.html' %}
{% load static %}

{% block title %}
Editar Comunidade
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/comunidade.css' %}">
{% endblock %}

{% block content %}

<section class="form-container">

    <h2>
        <i class="fas fa-pen"></i>
        Editar Comunidade
    </h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Nome da comunidade</label>

            <input
                type="text"
                name="nome"
                value="{{ comunidade.nome }}"
                required
            >
        </div>

        <div class="form-group">
            <label>Descrição</label>

            <textarea
                name="descricao"
                required
            >{{ comunidade.descricao }}</textarea>
        </div>

        <button
            type="submit"
            class="btn"
        >
            Salvar Alterações
        </button>

    </form>

</section>

{% endblock %}
