{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Leitor | Parabook</title>
    <!-- Importação de Arquivo Estático corrigida para o Django -->
    <link rel="stylesheet" href="{% static 'css/extras.css' %}">
</head>
<body>

    <!-- Canvas para renderização de efeitos visuais -->
    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <h1>📚 Que Tipo de Leitor Você É?</h1>
        <p class="subtitulo">Descubra seu perfil em menos de 30 segundos.</p>

        <!-- Barra de Progresso Interativa -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <form id="quizForm">
            <div class="pergunta">
                <h3>1. O que mais te interessa?</h3>
                <label class="radio-label"><input type="radio" name="q1" value="conhecimento" required> Tecnologia</label>
                <label class="radio-label"><input type="radio" name="q1" value="fantasia"> Fantasia</label>
                <label class="radio-label"><input type="radio" name="q1" value="romance"> Romance</label>
                <label class="radio-label"><input type="radio" name="q1" value="carreira"> Desenvolvimento Pessoal</label>
            </div>

            <div class="pergunta">
                <h3>2. Você lê com qual frequência?</h3>
                <label class="radio-label"><input type="radio" name="q2" value="conhecimento" required> Todos os dias</label>
                <label class="radio-label"><input type="radio" name="q2" value="fantasia"> Quando tenho vontade</label>
                <label class="radio-label"><input type="radio" name="q2" value="romance"> Finais de semana</label>
                <label class="radio-label"><input type="radio" name="q2" value="carreira"> Quero criar o hábito</label>
            </div>

            <div class="pergunta">
                <h3>3. O que você busca em um livro?</h3>
                <label class="radio-label"><input type="radio" name="q3" value="conhecimento" required> Aprender</label>
                <label class="radio-label"><input type="radio" name="q3" value="fantasia"> Aventuras</label>
                <label class="radio-label"><input type="radio" name="q3" value="romance"> Emoções</label>
                <label class="radio-label"><input type="radio" name="q3" value="carreira"> Evolução pessoal</label>
            </div>

            <button type="submit" id="submitBtn">Descobrir Perfil</button>
        </form>

        <div id="resultado"></div>

        <!-- Tag de URL dinâmica do Django substituindo link relativo -->
        <a class="link-voltar" href="{% url 'dashboard:surpresa' %}">🔍 Procurar página secreta</a>
    </div>

    <!-- Script carregado via tag static do Django -->
    <script src="{% static 'js/leitor.js' %}"></script>
</body>
</html>
