<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>parabook-web</title>
    <!-- Inter é a fonte do design system (base.css a declara no body).
         Vinha por @import dentro de tela-login.css, então só carregava em
         quem abrisse a tela de login — o resto do app caía no sans-serif
         do sistema. Aqui carrega uma vez, para todas as rotas, e sem a
         fila de espera que um @import de CSS cria. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link id="parabook-fontes-publicas" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Spectral:wght@400;600;700&display=swap">

    <!-- Restaura a tipografia antes da primeira pintura. O backend continua
         sendo a autoridade: o AuthContext corrige esta cache assim que o
         perfil autenticado chega, inclusive após mudança de plano ou role. -->
    <script>
      (function () {
        var fontes = {
          leitura_clara: 'https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@300;400;500;600;700;800&family=Literata:wght@400;600;700&display=swap',
          oficina_autor: 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@400;600;700&display=swap',
          edicao_premium: 'https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700;800&family=Source+Serif+4:wght@400;600;700&display=swap'
        };
        try {
          var salva = localStorage.getItem('parabookTipografia');
          var tipografia = fontes[salva] ? salva : 'padrao';
          document.documentElement.setAttribute('data-tipografia', tipografia);
          if (fontes[tipografia]) {
            var link = document.createElement('link');
            link.id = 'parabook-tipografia-ativa';
            link.rel = 'stylesheet';
            link.href = fontes[tipografia];
            document.head.appendChild(link);
          }
        } catch (e) {
          document.documentElement.setAttribute('data-tipografia', 'padrao');
        }
      })();
    </script>

    <!-- Bootstrap e FontAwesome da aplicação antiga -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Define o tema ANTES da primeira pintura.

         Se isso rodasse dentro do React, a página apareceria escura por
         um instante antes de virar clara — o "flash of wrong theme".
         Por isso é um script bloqueante aqui no <head>, e não um efeito
         no App: precisa executar antes do browser desenhar qualquer
         coisa. É também o único lugar que lê prefers-color-scheme, para
         a paleta clara existir uma vez só (em base.css).

         A ordem é: escolha salva do usuário > preferência do sistema. -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('parabookTema');
          var tema;
          if (salvo === 'claro' || salvo === 'tarde' || salvo === 'escuro') {
            tema = salvo;
          } else {
            tema = window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
          }
          document.documentElement.setAttribute('data-tema', tema);
        } catch (e) {
          document.documentElement.setAttribute('data-tema', 'escuro');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
