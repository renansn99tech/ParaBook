{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ParaBook{% endblock %}</title>

        <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    {% block extra_css %}
    {% endblock %}
</head>
<body>
    {% include 'components/navbar.html' %}


    {% if messages %}
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 5000,
                timerProgressBar: true,
                background: '#0f172a',
                color: '#ffffff',
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            });

            // Fila de mensagens (evita atropelamento)
            let atraso = 0;
            
            {% for message in messages %}
                setTimeout(() => {
                    let tipoIcone = '{{ message.tags }}';
                    if (tipoIcone === 'error') tipoIcone = 'error';
                    else if (tipoIcone === 'warning') tipoIcone = 'warning';
                    else if (tipoIcone === 'success') tipoIcone = 'success';
                    else tipoIcone = 'info';

                    Toast.fire({
                        icon: tipoIcone,
                        title: '{{ message }}'
                    });
                }, atraso);
                
                atraso += 1500; // Aguarda 1.5s antes de exibir a próxima notificação
            {% endfor %}
        });
    </script>
    {% endif %}

    {% block content %}{% endblock %}

    {% include 'components/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
