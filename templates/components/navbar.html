{% load static %}

<header class="navbar">

    <nav class="navbar-container">

        <div class="logo-container">

            <img
                src="{% static 'img/logo-nova.png' %}"
                alt="ParaBook"
                class="logo-img">

            <h1 class="logo">
                <span class="para">Para</span>
                <span class="book">Book</span>
            </h1>

        </div>

        <ul class="menu">

            <li>
                <a href="{% url 'home' %}">
                    Explorar
                </a>
            </li>

            <li>
                <a href="{% url 'comunidades' %}">
                    Comunidades
                </a>
            </li>

            <li>
                <a href="{% url 'biblioteca' %}">
                    Biblioteca
                </a>
            </li>

            <li>
                <a href="{% url 'obras_autores' %}">
                    Publicar Livro
                </a>
            </li>

        </ul>

        <div class="nav-actions">

            {% if user.is_authenticated %}
                    <a href="{% url 'usuarios:logout' %}" class="btn-nav btn-sair" id="btnLogout">
                        Sair <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </a>
                {% else %}
                    <a href="{% url 'usuarios:login' %}" class="btn-nav btn-entrar">
                        Entrar <i class="fa-solid fa-user"></i> 
                    </a>

            {% endif %}

        </div>

    </nav>

</header>
