{% load static %}

<header class="navbar">

    <nav class="navbar-container">

    <div class="logo-container">

        <img
            src="{% static 'img/logo-nova.png' %}"
            alt="ParaBook"
            class="logo-img">

        <h1 class="logo">
            <span class="para">Para</span>
            <span class="book">Book</span>
        </h1>

    </div>

    <ul class="menu">

        <li><a href="{% url 'home' %}">Explorar</a></li>

        <li><a href="{% url 'comunidades' %}">Comunidades</a></li>

        <li><a href="{% url 'lista_autores' %}">Autores</a></li>

        <li><a href="{% url 'obras_autores' %}">
            Publicar Livro
        </a></li>

    </ul>

    <div class="nav-actions">

        <button class="search-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        {% if user.is_authenticated %}

            <a href="{% url 'usuarios:logout' %}"
               class="btn-nav btn-outline">
               Sair
            </a>

        {% else %}

            <a href="{% url 'usuarios:login' %}"
               class="btn-nav btn-outline">
               Entrar
            </a>

        {% endif %}

    </div>

</nav>

</header>
