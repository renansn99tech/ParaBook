{% load static %}
<header>
    <nav class="container nav">

        <div class="logo-container">

            <img src="{% static 'img/logo-nova.png' %}"
                alt="Logo Parabook"
                class="logo-img">

            <h1 class="logo">
                <span class="para">Para</span>
                <span class="book">Book</span>
            </h1>

        </div>

        <ul class="menu">

            <li>
                <a href="{% url 'home' %}">
                    Início
                </a>
            </li>

            <li>
                <a href="{% url 'biblioteca' %}">
                    Meus Livros
                </a>
            </li>

            <li>
                <a href="{% url 'comunidades' %}">
                    Comunidades
                </a>
            </li>

            <li>
                <a href="{% url 'sobre' %}">
                    Sobre
                </a>
            </li>

            {% if user.is_authenticated %}
            <li>
                <a href="{% url 'perfis:perfil_pessoal' %}">Perfil</a>
            </li>
            {% endif %}

            <li>
                {% if user.is_authenticated %}
                    <a href="{% url 'usuarios:logout' %}" class="btn-nav btn-sair" id="btnLogout">
                        Sair <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </a>
                {% else %}
                    <a href="{% url 'usuarios:login' %}" class="btn-nav btn-entrar">
                        Entrar <i class="fa-solid fa-user"></i> 
                    </a>
                {% endif %}
            </li>

            <li>
                <button id="theme-toggle"
                    class="login-btn">
                    🌙
                </button>
            </li>

        </ul>
    </nav>
</header>
