{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/password-reset.css' %}">

<div class="reset-page">
    <div class="reset-container">
        
        <h2>Senha Redefinida!</h2>
        
        <p class="reset-text">
            Sua senha foi alterada com sucesso. Sua conta está segura e pronta para uso.
        </p>

        <a href="{% url 'usuarios:login' %}" class="reset-btn" style="display: block; text-align: center; text-decoration: none; box-sizing: border-box;">
            Acessar Conta
        </a>

    </div>
</div>
{% endblock %}
