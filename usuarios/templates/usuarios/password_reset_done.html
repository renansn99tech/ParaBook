{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/password-reset.css' %}">

<div class="reset-page">
    <div class="reset-container">
        
        <h2>E-mail Enviado!</h2>
        
        <p class="reset-text">
            Enviamos as instruções para recuperação de senha para o seu e-mail. <br><br>
            Por favor, verifique sua caixa de entrada e também a pasta de spam.
        </p>

        <a href="{% url 'usuarios:login' %}" class="reset-btn" style="display: block; text-align: center; text-decoration: none; box-sizing: border-box;">
            Voltar ao Login
        </a>

    </div>
</div>
{% endblock %}
