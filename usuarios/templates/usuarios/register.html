{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Criar Conta</h2>

    <form method="post" novalidate>
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="alert alert-danger" style="color: #ef4444; margin-bottom: 15px;">
                Por favor, corrija os erros abaixo.
            </div>
        {% endif %}
        
        {{ form.as_p }}

        <button type="submit">
            Cadastrar
        </button>
    </form>
</div>
{% endblock %}
